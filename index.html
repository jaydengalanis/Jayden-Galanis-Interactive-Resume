<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flame — Portfolio</title>
  </head>
  <body>
    <canvas id="bg"></canvas>

    <div id="hint">🖱 Drag to orbit &nbsp;|&nbsp; Scroll to zoom in</div>
    <button id="back-btn">← BACK TO DESK</button>
    <button id="mute-btn" class="glass-aero" id="mute-button" title="Toggle Audio">
      <div class="mute-icon">
        <svg id="icon-sound" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M11 5L6 9H2v6h4l5 4V5z" fill="currentColor"/>
          <path d="M15.54 8.46a5 5 0 0 1 0 7.07" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <path d="M19.07 4.93a10 10 0 0 1 0 14.14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <svg id="icon-mute" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="display:none;">
          <path d="M11 5L6 9H2v6h4l5 4V5z" fill="currentColor"/>
          <line x1="23" y1="9" x2="17" y2="15" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <line x1="17" y1="9" x2="23" y2="15" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </div>
      <span class="mute-label" id="mute-label">SOUND</span>
    </button>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
